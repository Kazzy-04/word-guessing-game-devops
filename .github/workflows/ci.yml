name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
    test-and-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
            - name: Install dependencies
              run: |
                pip install -r requirements.txt
            - name: Run Tests
              run: |
                python -m pytest -v

            - name: Build Docker Image
              run: |
                docker build -t word-guessing-game:test . 